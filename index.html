<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KAIRÓS Reader — Ve por el eco</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          paper: 'rgb(var(--paper) / <alpha-value>)',
          paper2: 'rgb(var(--paper-2) / <alpha-value>)',
          ink: 'rgb(var(--ink) / <alpha-value>)',
          clay: 'rgb(var(--clay) / <alpha-value>)',
          claydeep: 'rgb(var(--clay-deep) / <alpha-value>)',
          jade: 'rgb(var(--jade) / <alpha-value>)',
          ochre: 'rgb(var(--ochre) / <alpha-value>)',
        },
        fontFamily: {
          serif: ['Fraunces', '"Iowan Old Style"', 'Georgia', 'serif'],
          sans: ['Inter', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" crossorigin></script>
<style>
  :root {
    --paper: 250 247 242; --paper-2: 242 235 224; --ink: 36 31 26;
    --clay: 192 86 42; --clay-deep: 170 72 32; --jade: 31 122 107; --ochre: 198 154 69;
    --on-clay: 250 247 242;
    --grain-blend: multiply; --grain-op: .55;
    --halo-a: 198 154 69; --halo-b: 192 86 42;
    --glow: 0;
  }
  .dark {
    --paper: 22 18 15; --paper-2: 32 26 21; --ink: 240 231 217;
    --clay: 222 112 64; --clay-deep: 222 112 64; --jade: 70 196 170; --ochre: 216 176 96;
    --on-clay: 22 18 15;
    --grain-blend: soft-light; --grain-op: .5;
    --halo-a: 70 196 170; --halo-b: 198 120 60;
    --glow: 1;
  }
  html, body { background: rgb(var(--paper-2)); color: rgb(var(--ink)); }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; transition: background .8s ease, color .8s ease; }
  .serif { font-family: Fraunces, "Iowan Old Style", Georgia, serif; font-variation-settings: "SOFT" 100, "opsz" 144; }
  .serif-text { font-family: Fraunces, "Iowan Old Style", Georgia, serif; font-variation-settings: "SOFT" 60, "opsz" 24; }

  /* ---------- Materiality ---------- */
  .phone {
    position: relative; overflow: hidden; isolation: isolate;
    width: min(372px, calc(100vw - 32px)); height: 800px;
    border-radius: 46px; background: rgb(var(--paper));
    box-shadow:
      0 0 0 1px rgb(var(--ink) / .08),
      0 1px 0 0 rgb(255 255 255 / .5) inset,
      0 2px 4px rgb(36 31 26 / .04),
      0 12px 24px -8px rgb(36 31 26 / .10),
      0 40px 80px -24px rgb(36 31 26 / .22);
    transition: background .8s ease;
  }
  .dark .phone { box-shadow: 0 0 0 1px rgb(255 255 255 / .06), 0 30px 80px -20px rgb(0 0 0 / .7), 0 0 120px -40px rgb(var(--jade) / .25); }
  .grain::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 50;
    mix-blend-mode: var(--grain-blend); opacity: var(--grain-op);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .14  0 0 0 0 .12  0 0 0 0 .10  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .halo { position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60% 40% at 18% 8%, rgb(var(--halo-a) / .22), transparent 70%),
      radial-gradient(50% 35% at 100% 100%, rgb(var(--halo-b) / .12), transparent 70%);
  }
  .engrave { background-image: repeating-linear-gradient(135deg, rgb(var(--ink) / .09) 0 1px, transparent 1px 5px); }
  .rule { height: 1px; background: linear-gradient(90deg, rgb(var(--ink) / .35), rgb(var(--ink) / .05)); }
  .sheet {
    background: rgb(var(--paper));
    background-image: linear-gradient(180deg, rgb(255 255 255 / .35), transparent 40%);
    box-shadow: 0 0 0 1px rgb(var(--ink) / .08), 0 1px 1px rgb(36 31 26 / .05), 0 6px 14px -6px rgb(36 31 26 / .14), 0 18px 32px -18px rgb(36 31 26 / .18);
  }
  .dark .sheet { background: rgb(var(--paper-2)); background-image: linear-gradient(180deg, rgb(255 255 255 / .04), transparent 40%); box-shadow: 0 0 0 1px rgb(255 255 255 / .06), 0 20px 40px -20px rgb(0 0 0 / .7); }

  /* ---------- Echo ---------- */
  .echo-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgb(var(--jade) / .5); opacity: 0;
    animation: echo 8s cubic-bezier(.2,.6,.35,1) infinite; }
  .dark .echo-ring { box-shadow: 0 0 18px rgb(var(--jade) / .25), inset 0 0 18px rgb(var(--jade) / .12); }
  @keyframes echo { 0% { transform: scale(.14); opacity: 0 } 10% { opacity: .9 } 100% { transform: scale(1); opacity: 0 } }
  .echo-ring.settle { animation-name: settle; animation-timing-function: cubic-bezier(.1,.5,.2,1); }
  @keyframes settle { 0% { transform: scale(.2); opacity: 0 } 15% { opacity: .55 } 100% { transform: scale(.62); opacity: 0 } }
  .echo-core { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%;
    background: rgb(var(--jade)); box-shadow: 0 0 0 6px rgb(var(--jade) / .12), 0 0 calc(30px * var(--glow)) rgb(var(--jade) / .8);
    animation: breathe 5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.18) } }
  .breathe { animation: breathe-soft 6s ease-in-out infinite; transform-origin: center; }
  @keyframes breathe-soft { 0%,100% { transform: scale(1); filter: drop-shadow(0 0 0 rgb(var(--jade) / 0)) } 50% { transform: scale(1.045); filter: drop-shadow(0 0 calc(10px * var(--glow) + 2px) rgb(var(--jade) / .35)) } }

  /* ---------- Escucha (micro activo) ---------- */
  .echo-ring.listen { border-color: rgb(var(--clay) / .55); animation-name: listen; animation-timing-function: cubic-bezier(.15,.55,.3,1); }
  .dark .echo-ring.listen { box-shadow: 0 0 22px rgb(var(--clay) / .28), inset 0 0 18px rgb(var(--clay) / .14); }
  @keyframes listen { 0% { transform: scale(.12); opacity: 0 } 8% { opacity: .95 } 60% { opacity: .35 } 100% { transform: scale(1); opacity: 0 } }
  .echo-core.listen { background: rgb(var(--clay)); box-shadow: 0 0 0 7px rgb(var(--clay) / .14), 0 0 calc(34px * var(--glow) + 6px) rgb(var(--clay) / .7); animation: breathe 1.75s ease-in-out infinite; }

  .syl { color: rgb(var(--ink) / .28); animation: 3.5s ease-in-out infinite; }
  .syl-a { animation-name: sylA; } .syl-b { animation-name: sylB; }
  @keyframes sylA { 0%,10% { color: rgb(var(--ink) / .28) } 16%,38% { color: rgb(var(--clay)); text-shadow: 0 0 calc(18px * var(--glow)) rgb(var(--clay) / .45) } 48%,100% { color: rgb(var(--ink) / .55) } }
  @keyframes sylB { 0%,40% { color: rgb(var(--ink) / .28) } 46%,70% { color: rgb(var(--clay)); text-shadow: 0 0 calc(18px * var(--glow)) rgb(var(--clay) / .45) } 80%,100% { color: rgb(var(--ink) / .55) } }
  .syl-bar { transform: scaleX(0); transform-origin: left; animation: 3.5s cubic-bezier(.4,0,.2,1) infinite; }
  .syl-bar-a { animation-name: barA; } .syl-bar-b { animation-name: barB; }
  @keyframes barA { 0%,10% { transform: scaleX(0); opacity: 1 } 38% { transform: scaleX(1); opacity: 1 } 90% { transform: scaleX(1); opacity: .35 } 100% { transform: scaleX(1); opacity: 0 } }
  @keyframes barB { 0%,40% { transform: scaleX(0); opacity: 1 } 70% { transform: scaleX(1); opacity: 1 } 90% { transform: scaleX(1); opacity: .35 } 100% { transform: scaleX(1); opacity: 0 } }

  .rec-progress { stroke-dasharray: 1; stroke-dashoffset: 1; animation: recFill 3.5s linear infinite; }
  @keyframes recFill { 0% { stroke-dashoffset: 1; opacity: 1 } 92% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }
  .live-dot { animation: liveDot 1.75s ease-in-out infinite; }
  @keyframes liveDot { 0%,100% { opacity: .35; transform: scale(.85) } 50% { opacity: 1; transform: scale(1) } }

  /* ---------- Lámina docente (tablet) ---------- */
  .tablet {
    position: relative; overflow: hidden; isolation: isolate;
    width: min(1180px, calc(100vw - 32px)); border-radius: 34px; background: rgb(var(--paper));
    box-shadow: 0 0 0 1px rgb(var(--ink) / .08), 0 1px 0 0 rgb(255 255 255 / .5) inset, 0 12px 24px -8px rgb(36 31 26 / .10), 0 40px 80px -24px rgb(36 31 26 / .22);
    transition: background .8s ease;
  }
  .dark .tablet { box-shadow: 0 0 0 1px rgb(255 255 255 / .06), 0 30px 80px -20px rgb(0 0 0 / .7), 0 0 160px -50px rgb(var(--jade) / .25); }
  .layer { transition: opacity 1.2s cubic-bezier(.4,0,.2,1), filter 1.2s ease; }
  .layer-off { opacity: .07; filter: blur(2px); pointer-events: none; }
  .wave-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s cubic-bezier(.5,0,.2,1) forwards; }
  .headline-in { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }

  /* ---------- Motion ---------- */
  .rise { opacity: 0; animation: rise 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(4px) } to { opacity: 1; transform: none; filter: none } }
  .screen-in { animation: screenIn 1s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes screenIn { from { opacity: 0; transform: translateY(10px) scale(.985); filter: blur(8px) } to { opacity: 1; transform: none; filter: none } }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s cubic-bezier(.6,0,.2,1) .4s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0 } }
  .hint { transition: opacity 1.1s cubic-bezier(.4,0,.2,1), filter 1.1s ease; }

  .press { transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s ease, background-color .5s ease; }
  .press:hover { transform: translateY(-1px); }
  .press:active { transform: translateY(1px) scale(.99); }
  :focus-visible { outline: 2px solid rgb(var(--jade)); outline-offset: 3px; border-radius: 12px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .rise { opacity: 1 } .echo-ring { opacity: .25; transform: scale(.6) }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

/* ============ Primitivos del sistema ============ */

function Echo({ x = '50%', y = '45%', size = 560, rings = 5, duration = 8, settle = false, listening = false }) {
  return (
    <div aria-hidden="true" className="pointer-events-none absolute z-0"
      style={{ left: x, top: y, width: size, height: size, transform: 'translate(-50%,-50%)' }}>
      <svg viewBox="0 0 100 100" className="absolute inset-0 h-full w-full">
        {[10, 18, 26, 34, 42, 49].map((r, i) => (
          <circle key={r} cx="50" cy="50" r={r} fill="none"
            stroke="rgb(var(--ink) / .08)" strokeWidth=".14"
            strokeDasharray={i % 2 ? '.35 .9' : undefined} />
        ))}
        <line x1="50" y1="0" x2="50" y2="100" stroke="rgb(var(--ink) / .05)" strokeWidth=".12" />
        <line x1="0" y1="50" x2="100" y2="50" stroke="rgb(var(--ink) / .05)" strokeWidth=".12" />
      </svg>
      {Array.from({ length: rings }).map((_, i) => (
        <span key={i} className={'echo-ring' + (settle ? ' settle' : '') + (listening ? ' listen' : '')}
          style={{ animationDuration: `${duration}s`, animationDelay: `${-(duration / rings) * i}s` }} />
      ))}
      <span className={'echo-core' + (listening ? ' listen' : '')} />
    </div>
  );
}

function Screen({ children, className = '' }) {
  return (
    <div className={'phone grain ' + className}>
      <div className="halo" />
      <div className="relative z-10 flex items-center justify-between px-8 pt-4 text-[12px] font-medium tracking-tight text-ink/70">
        <span>9:41</span>
        <span className="h-[26px] w-[96px] rounded-full bg-ink/90 dark:bg-black" aria-hidden="true" />
        <span className="flex items-center gap-1" aria-hidden="true">
          <span className="h-[7px] w-[16px] rounded-[3px] border border-ink/50" />
        </span>
      </div>
      <div className="relative z-10 flex h-[calc(100%-46px)] flex-col">{children}</div>
    </div>
  );
}

function Mark({ label }) {
  return (
    <div className="flex items-center gap-2.5">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <circle cx="9" cy="9" r="2" fill="rgb(var(--clay))" />
        <circle cx="9" cy="9" r="5" fill="none" stroke="rgb(var(--ink) / .45)" strokeWidth=".8" />
        <circle cx="9" cy="9" r="8.2" fill="none" stroke="rgb(var(--ink) / .2)" strokeWidth=".8" />
      </svg>
      <span className="text-[11px] font-semibold uppercase tracking-[.22em] text-ink/80">Kairós</span>
      {label && <><span className="h-3 w-px bg-ink/20" /><span className="text-[11px] tracking-wide text-ink/55">{label}</span></>}
    </div>
  );
}

function Word({ syllables, size = 132, dotOpacity = 1, className = '' }) {
  return (
    <p lang="en" aria-label={syllables.join('')}
      className={'serif select-none leading-[.82] tracking-[-.045em] text-ink ' + className}
      style={{ fontSize: size, fontWeight: 380 }}>
      {syllables.map((s, i) => (
        <span key={i} aria-hidden="true">
          {i > 0 && (
            <span className="hint mx-[.04em] inline-block -translate-y-[.06em] text-ochre"
              style={{ opacity: dotOpacity, fontWeight: 300 }}>·</span>
          )}
          {s}
        </span>
      ))}
    </p>
  );
}

function KappaRing({ value, size = 58 }) {
  const r = 24, c = 2 * Math.PI * r;
  return (
    <div className="relative shrink-0" style={{ width: size, height: size }}>
      <svg viewBox="0 0 60 60" className="breathe h-full w-full -rotate-90" aria-hidden="true">
        <circle cx="30" cy="30" r={r} fill="none" stroke="rgb(var(--ink) / .1)" strokeWidth="2" />
        <circle cx="30" cy="30" r="28.5" fill="none" stroke="rgb(var(--ink) / .12)" strokeWidth=".5" strokeDasharray="1 2.2" />
        <circle cx="30" cy="30" r={r} fill="none" stroke="rgb(var(--jade))" strokeWidth="2.2" strokeLinecap="round"
          strokeDasharray={`${(value / 100) * c} ${c}`} />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center leading-none">
        <span className="serif text-[11px] italic text-ink/55">κ</span>
        <span className="serif text-[19px] text-ink" style={{ fontWeight: 450 }}>{value}</span>
      </div>
    </div>
  );
}

function PrimaryButton({ children, onClick, className = '' }) {
  return (
    <button type="button" onClick={onClick}
      className={'press group relative flex h-[60px] items-center gap-3 rounded-full bg-claydeep pl-3 pr-7 text-[15px] font-medium text-[rgb(var(--on-clay))] shadow-[0_1px_0_rgb(255_255_255/.25)_inset,0_10px_24px_-10px_rgb(var(--clay)/.7),0_2px_4px_rgb(36_31_26/.12)] ' + className}>
      {children}
    </button>
  );
}
function GhostButton({ children, onClick, className = '' }) {
  return (
    <button type="button" onClick={onClick}
      className={'press sheet flex h-[60px] items-center gap-3 rounded-full pl-3 pr-6 text-[15px] font-medium text-ink ' + className}>
      {children}
    </button>
  );
}
const PlayGlyph = () => (
  <span className="flex h-9 w-9 items-center justify-center rounded-full border border-ink/15 bg-paper2" aria-hidden="true">
    <svg width="11" height="12" viewBox="0 0 11 12"><path d="M1 1.2v9.6L10 6z" fill="rgb(var(--jade))" /></svg>
  </span>
);
const RecGlyph = () => (
  <span className="relative flex h-9 w-9 items-center justify-center rounded-full bg-[rgb(var(--on-clay)/.16)]" aria-hidden="true">
    <span className="absolute inset-0 rounded-full border border-[rgb(var(--on-clay)/.35)]" />
    <span className="h-3 w-3 rounded-full bg-[rgb(var(--on-clay))]" />
  </span>
);

/* ============ 1 · Autoinforme ============ */

const MOODS = [
  { id: 'ganas', emoji: '🙂', label: 'Con ganas', note: 'Hoy leo con energía', num: 'i' },
  { id: 'normal', emoji: '😐', label: 'Normal', note: 'Un día como otros', num: 'ii' },
  { id: 'cansado', emoji: '😴', label: 'Cansado', note: 'Vamos despacio', num: 'iii' },
];

function CheckInScreen({ onNext }) {
  const [mood, setMood] = useState('normal');
  return (
    <Screen>
      <Echo x="102%" y="20%" size={380} rings={4} duration={11} />
      <div className="px-7 pt-8"><Mark label="antes de empezar" /></div>

      <div className="rise px-7 pt-16" style={{ animationDelay: '.1s' }}>
        <p className="mb-4 text-[11px] uppercase tracking-[.22em] text-ink/50">martes, 11 de noviembre</p>
        <h1 className="serif text-[54px] leading-[.95] tracking-[-.035em] text-ink" style={{ fontWeight: 360 }}>
          ¿Cómo<br />estás <em className="text-clay" style={{ fontWeight: 330 }}>hoy</em>?
        </h1>
      </div>

      <fieldset className="mt-10 flex flex-col gap-3 px-5">
        <legend className="sr-only">Elige cómo te sientes hoy</legend>
        {MOODS.map((m, i) => {
          const on = mood === m.id;
          return (
            <label key={m.id}
              className="rise press relative flex cursor-pointer items-center gap-4 rounded-[26px] py-3.5 pl-3.5 pr-5"
              style={{ animationDelay: `${.3 + i * .12}s`, marginLeft: [0, 22, 8][i], marginRight: [18, 0, 30][i] }}>
              <input type="radio" name="mood" value={m.id} checked={on} onChange={() => setMood(m.id)} className="peer sr-only" />
              <span className={'absolute inset-0 rounded-[26px] transition-all duration-700 ' + (on ? 'sheet ring-1 ring-jade/50' : 'bg-transparent ring-1 ring-ink/10')} />
              <span className={'relative flex h-14 w-14 shrink-0 items-center justify-center rounded-full text-[28px] transition-all duration-700 ' + (on ? 'bg-jade/12' : 'bg-paper2')}>
                <span aria-hidden="true">{m.emoji}</span>
                {on && <span className="absolute inset-[-5px] rounded-full border border-jade/40" />}
              </span>
              <span className="relative flex flex-1 flex-col">
                <span className="serif text-[24px] leading-tight text-ink" style={{ fontWeight: on ? 460 : 380 }}>{m.label}</span>
                <span className="text-[13px] text-ink/55">{m.note}</span>
              </span>
              <span className="serif relative text-[13px] italic text-ink/35" aria-hidden="true">{m.num}</span>
            </label>
          );
        })}
      </fieldset>

      <div className="mt-auto flex items-end justify-between px-7 pb-10">
        <div className="max-w-[170px]">
          <div className="rule mb-3 w-10" />
          <p className="serif-text text-[15px] italic leading-snug text-ink/65">No hay respuesta incorrecta.</p>
        </div>
        <button type="button" onClick={onNext} aria-label="Continuar"
          className="press flex h-14 w-14 items-center justify-center rounded-full bg-ink text-paper shadow-[0_10px_24px_-10px_rgb(36_31_26/.6)]">
          <svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><path d="M1 7h15M11 1.5 16.5 7 11 12.5" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" /></svg>
        </button>
      </div>
    </Screen>
  );
}

/* ============ 2 · Lectura ============ */

function ReadingScreen({ onNext }) {
  return (
    <Screen>
      <Echo x="40%" y="43%" size={620} rings={6} duration={9} />
      <div className="flex items-center justify-between px-7 pt-8">
        <Mark />
        <span className="text-[11px] tabular-nums tracking-wide text-ink/50">palabra <span className="text-ink/80">1</span> / 4</span>
      </div>

      <div className="flex flex-1 flex-col justify-center pl-7">
        <div className="rise" style={{ animationDelay: '.15s' }}>
          <Word syllables={['wa', 'ter']} size={128} />
        </div>
        <div className="rise mt-7 flex items-baseline gap-4 pl-1" style={{ animationDelay: '.5s' }}>
          <span className="font-sans text-[14px] tracking-wide text-ink/55">/ˈwɔː·tər/</span>
          <span className="h-px w-8 bg-ink/20" />
          <span className="serif-text text-[16px] italic text-ink/55">agua</span>
        </div>
      </div>

      <div className="rise flex flex-col items-start gap-3 px-5 pb-10" style={{ animationDelay: '.8s' }}>
        <GhostButton><PlayGlyph />Escuchar el modelo</GhostButton>
        <PrimaryButton onClick={onNext} className="ml-10"><RecGlyph />Léelo tú</PrimaryButton>
      </div>
    </Screen>
  );
}

/* ============ 2b · Escucha ============ */

const TAKE_SECONDS = 3.5;

function useLoopingSeconds(total) {
  const [t, setT] = useState(0);
  useEffect(() => {
    const start = performance.now();
    const id = setInterval(() => setT(((performance.now() - start) / 1000) % total), 100);
    return () => clearInterval(id);
  }, [total]);
  return t;
}

function ListeningScreen({ onNext }) {
  const t = useLoopingSeconds(TAKE_SECONDS);
  const r = 40;
  return (
    <Screen>
      <div className="flex items-center justify-between px-7 pt-8">
        <Mark />
        <span className="flex items-center gap-2 text-[11px] tracking-wide text-ink/60">
          <span className="live-dot h-1.5 w-1.5 rounded-full bg-clay" aria-hidden="true" />

const TRAJECTORY = [

function smoothPath(pts) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`;
  }
  return d;
}

function KappaChart() {
  const W = 320, H = 210, top = 26, bottom = 170;

// Datos de ejemplo: [sílaba, duración s, vocal s, tónica, f0 en semitonos]; objetos = pausas.
const READING = [
  ['El', .17, .09, 0, 1.5], ['rí', .26, .15, 1, 4.5], ['o', .17, .12, 0, 3.6], ['lle', .24, .12, 1, 3.8],
  ['va', .18, .09, 0, 2.6], ['el', .13, .07, 0, 2.2], ['a', .2, .14, 1, 2.8], ['gua', .24, .1, 0, .6],
  { pause: .24 },
  ['has', .23, .1, 1, 2.6], ['ta', .17, .08, 0, 2.0],
  { pause: .38, flag: true },
  ['el', .14, .08, 0, 1.8], ['mar', .32, .16, 1, -.6],
  { pause: .56 },
  ['Quién', .3, .14, 1, 3.4], ['la', .14, .07, 0, 1.6], ['es', .16, .1, 0, 1.4], ['pe', .2, .1, 1, 2.6],
  ['ra', .15, .08, 0, 1.5], ['a', .14, .1, 0, 2.2], ['llí', .3, .15, 1, 4.8],
];

const fmt = (n, d = 1) => n.toFixed(d).replace('.', ',');

function buildReading() {
  let t = 0;
  const items = READING.map((it) => {
    if (!Array.isArray(it)) { const o = { ...it, t }; t += it.pause; return o; }
    const [s, d, v, st, f0] = it;
    const onset = /^[aeiouáéíóú]/i.test(s) ? .06 : .38;
    const o = { s, d, v, st, f0, t, vs: t + onset * d };
    t += d;
    return o;
  });
  const syl = items.filter((i) => !i.pause);
  const vs = syl.map((s) => s.v);
  let acc = 0;
  for (let i = 0; i < vs.length - 1; i++) acc += Math.abs(vs[i] - vs[i + 1]) / ((vs[i] + vs[i + 1]) / 2);
  const npvi = (100 * acc) / (vs.length - 1);
  const pctV = (100 * vs.reduce((a, b) => a + b, 0)) / syl.reduce((a, s) => a + s.d, 0);
  const f0s = syl.map((s) => s.f0);
  const df0 = Math.max(...f0s) - Math.min(...f0s);
  return { items, T: t, npvi, pctV, df0, f0min: Math.min(...f0s), f0max: Math.max(...f0s) };
}
const R = buildReading();

function ReadingTrace({ stage, flagOn }) {
  const W = 760, PL = 12, PR = 64, WC = 140, A = 34;
  const x = (t) => PL + (t / R.T) * (W - PL - PR);
  const fy = (f) => 92 - ((f + 2) / 8) * 70;
  const L = (n) => 'layer' + (stage >= n ? '' : ' layer-off');

  let seed = 11;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const top = [], bot = [];
  R.items.forEach((it) => {
    const dur = it.pause || it.d;
    const n = Math.max(5, Math.round(dur / .008));
    for (let j = 0; j < n; j++) {
      const u = j / (n - 1), tt = it.t + u * dur;
      let a;
      if (it.pause) a = .025 + .02 * rnd();
      else {
        const inV = tt >= it.vs && tt <= it.vs + it.v;
        a = Math.pow(Math.sin(Math.PI * u), .7) * (inV ? 1 : .5) * (it.st ? 1 : .68) * (.7 + .3 * rnd());
      }
      top.push([x(tt).toFixed(1), (WC - a * A).toFixed(1)]);
      bot.push([x(tt).toFixed(1), (WC + a * A * .85).toFixed(1)]);
    }
  });
  const wave = 'M' + top.map((p) => p.join(',')).join(' L') + ' L' + bot.reverse().map((p) => p.join(',')).join(' L') + ' Z';

  const segs = [[]];
  R.items.forEach((it) => { if (it.pause) segs.push([]); else segs[segs.length - 1].push([x(it.vs + it.v / 2), fy(it.f0)]); });

  return (
    <svg viewBox={`0 0 ${W} 262`} className="w-full overflow-visible" role="img"
      aria-label={`Huella de una lectura de ejemplo de ${fmt(R.T)} segundos: onda de voz, vocales, pausas y entonación`}>
      <defs>
        <pattern id="pz" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="5" stroke="rgb(var(--ink) / .12)" strokeWidth="1" />
        </pattern>
        <linearGradient id="wv" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor="rgb(var(--jade))" stopOpacity=".55" />
          <stop offset=".5" stopColor="rgb(var(--jade))" stopOpacity=".28" />
          <stop offset="1" stopColor="rgb(var(--jade))" stopOpacity=".5" />
        </linearGradient>
      </defs>

      <g className={L(1)}>
        {R.items.filter((i) => i.pause).map((p, i) => {
          const flagged = p.flag && flagOn;
          return (
            <g key={i}>
              <rect x={x(p.t)} y="14" width={x(p.t + p.pause) - x(p.t)} height="212" fill="url(#pz)" rx="3"
                stroke={flagged ? 'rgb(var(--clay))' : 'none'} strokeDasharray="3 3" />
              <text x={(x(p.t) + x(p.t + p.pause)) / 2} y="8" textAnchor="middle" fontSize="10" fill={flagged ? 'rgb(var(--clay))' : 'rgb(var(--ink) / .5)'} fontFamily="Inter">{fmt(p.pause, 2)} s</text>
            </g>
          );
        })}
      </g>

      <line x1={PL} x2={W - PR} y1={WC} y2={WC} stroke="rgb(var(--ink) / .1)" />
      <path d={wave} fill="url(#wv)" className={L(0)} />
      <path d={wave} fill="none" stroke="rgb(var(--jade))" strokeWidth=".6" pathLength="1" className={'wave-draw ' + L(0)} />

      <g className={L(1)}>
        {R.items.filter((i) => !i.pause).map((s, i) => (
          <rect key={i} x={x(s.vs)} width={Math.max(2, x(s.vs + s.v) - x(s.vs))} y={206 - s.v * 90} height={s.v * 90} rx="1.5"
            fill={s.st ? 'rgb(var(--jade))' : 'rgb(var(--jade) / .45)'} />
        ))}
        <line x1={PL} x2={W - PR} y1="206" y2="206" stroke="rgb(var(--ink) / .14)" />
      </g>

      <g className={L(1)}>
        {segs.map((pts, i) => pts.length > 1 && (
          <g key={i}>
            <path d={smoothPath(pts)} fill="none" stroke="rgb(var(--ochre))" strokeWidth="1.8" strokeLinecap="round" />
            {pts.map(([px, py], j) => <circle key={j} cx={px} cy={py} r="1.8" fill="rgb(var(--ochre))" />)}
          </g>
        ))}
      </g>

      <g className={L(2)}>
        <line x1={W - PR + 18} x2={W - PR + 18} y1={fy(R.f0max)} y2={fy(R.f0min)} stroke="rgb(var(--ochre))" />
        <line x1={W - PR + 14} x2={W - PR + 22} y1={fy(R.f0max)} y2={fy(R.f0max)} stroke="rgb(var(--ochre))" />
        <line x1={W - PR + 14} x2={W - PR + 22} y1={fy(R.f0min)} y2={fy(R.f0min)} stroke="rgb(var(--ochre))" />
        <text x={W - PR + 28} y={(fy(R.f0max) + fy(R.f0min)) / 2 - 3} fontSize="11" fill="rgb(var(--ink))" fontFamily="Fraunces" fontStyle="italic">Δf0</text>
        <text x={W - PR + 28} y={(fy(R.f0max) + fy(R.f0min)) / 2 + 11} fontSize="10" fill="rgb(var(--ink) / .6)" fontFamily="Inter">{fmt(R.df0)} st</text>
        <text x={W - PR + 18} y={WC + 4} fontSize="11" fill="rgb(var(--ink))" fontFamily="Fraunces" fontStyle="italic">%V</text>
        <text x={W - PR + 18} y={WC + 18} fontSize="10" fill="rgb(var(--ink) / .6)" fontFamily="Inter">{fmt(R.pctV, 0)} %</text>
        <text x={W - PR + 18} y="196" fontSize="11" fill="rgb(var(--ink))" fontFamily="Fraunces" fontStyle="italic">nPVI-V</text>
        <text x={W - PR + 18} y="210" fontSize="10" fill="rgb(var(--ink) / .6)" fontFamily="Inter">{fmt(R.npvi)}</text>
      </g>

      {R.items.filter((i) => !i.pause).map((s, i) => (
        <g key={i}>
          <text x={x(s.t + s.d / 2)} y="242" textAnchor="middle" fontSize="13" fontFamily="Fraunces"
            fill={s.st ? 'rgb(var(--ink))' : 'rgb(var(--ink) / .5)'}>{s.s}</text>
          {s.st === 1 && <circle cx={x(s.t + s.d / 2)} cy="252" r="2" fill="rgb(var(--clay))" />}
        </g>
      ))}
    </svg>
  );
}

function SacCycle({ phase, onPick }) {
  const idx = SAC.findIndex((p) => p.id === phase);
  const S = 210, c = S / 2, r = 72;
  const pos = (i) => { const a = (-90 + i * 72) * Math.PI / 180; return [c + r * Math.cos(a), c + r * Math.sin(a)]; };
  const arc = (i) => { const [x1, y1] = pos(i), [x2, y2] = pos(i + 1); return `M${x1},${y1} A${r},${r} 0 0 1 ${x2},${y2}`; };
  return (
    <div className="relative shrink-0" style={{ width: S, height: S }}>
      <svg viewBox={`0 0 ${S} ${S}`} className="absolute inset-0 h-full w-full" aria-hidden="true">
        <circle cx={c} cy={c} r={r} fill="none" stroke="rgb(var(--ink) / .12)" strokeDasharray="2 4" />
        {SAC.map((_, i) => i < idx && <path key={i} d={arc(i)} fill="none" stroke="rgb(var(--jade) / .6)" strokeWidth="1.6" />)}
        {idx > 0 && <path d={arc(idx - 1)} fill="none" stroke="rgb(var(--clay))" strokeWidth="2" strokeLinecap="round" />}
        {SAC.map((_, i) => {
          const [x, y] = pos(i);
          return i === idx
            ? <g key={i}><circle cx={x} cy={y} r="13" fill="rgb(var(--clay) / .14)" /><circle cx={x} cy={y} r="6" fill="rgb(var(--clay))" /></g>
            : <circle key={i} cx={x} cy={y} r="4.5" fill={i < idx ? 'rgb(var(--jade))' : 'rgb(var(--paper))'} stroke="rgb(var(--jade))" strokeWidth="1.3" />;
        })}
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <span className="text-[9.5px] uppercase tracking-[.2em] text-ink/45">ciclo SAC</span>
        <span className="serif mt-1 text-[19px] italic text-ink">{SAC[idx].label}</span>
      </div>
      {SAC.map((p, i) => {
        const a = (-90 + i * 72) * Math.PI / 180;
        const lx = c + (r + 28) * Math.cos(a), ly = c + (r + 22) * Math.sin(a);
        return (
          <button key={p.id} type="button" onClick={() => onPick(p.id)} aria-pressed={i === idx}
            className={'absolute -translate-x-1/2 -translate-y-1/2 whitespace-nowrap rounded-full px-1.5 text-[10px] font-semibold uppercase tracking-[.16em] transition-colors duration-500 ' + (i === idx ? 'text-clay' : 'text-ink/50 hover:text-ink')}
            style={{ left: lx, top: ly }}>{p.label}</button>
        );
      })}
    </div>
  );
}

            </div>
            <ReadingTrace stage={stage} flagOn={stage >= 2} />
            <div className={'mt-5 grid grid-cols-1 gap-5 border-t border-ink/10 pt-4 sm:grid-cols-3 ' + L(1)}>
              {[
                ['Entonación', 'Δf0', `${fmt(R.df0)} st`, 'cuánto sube y baja la voz', <svg width="22" height="10" viewBox="0 0 22 10"><path d="M1,8 C6,1 14,2 21,6" fill="none" stroke="rgb(var(--ochre))" strokeWidth="1.6" strokeLinecap="round" /></svg>],
                ['Proporción vocálica', '%V', `${fmt(R.pctV, 0)} %`, 'parte del tiempo que suenan vocales', <svg width="22" height="10" viewBox="0 0 22 10"><path d="M1,5 Q4,0 7,5 T13,5 T19,5" fill="none" stroke="rgb(var(--jade))" strokeWidth="1.4" /></svg>],
                ['Ritmo', 'nPVI-V', fmt(R.npvi), 'contraste entre vocales seguidas', <svg width="22" height="10" viewBox="0 0 22 10">{[4, 9, 3, 7, 5].map((h, i) => <rect key={i} x={i * 4.5} y={10 - h} width="3" height={h} rx="1" fill="rgb(var(--jade))" />)}</svg>],
              ].map(([name, k, v, note, glyph]) => (
                <div key={k} className="flex items-start gap-3">
                  <span className="mt-1.5" aria-hidden="true">{glyph}</span>
                  <div>
                    <p className="flex items-baseline gap-2"><span className="serif text-[15px] italic text-ink">{k}</span><span className="serif text-[20px] tabular-nums text-ink" style={{ fontWeight: 420 }}>{v}</span></p>
                    <p className="text-[11.5px] leading-snug text-ink/55">{name}: {note}</p>
                  </div>
                </div>
              ))}
            </div>
            <p className={'mt-3 text-[11px] text-ink/45 ' + L(1)}>Señal disponible · cálculo sobre una lectura de ejemplo, sin micrófono conectado.</p>
          </section>

          <aside className="flex flex-1 flex-col gap-8 lg:max-w-[330px]" aria-label="Huella y niveles de prosodia">
            <Huella stage={stage} />
            <div className={L(2)}><ProsodyLevels /></div>
          </aside>
        </div>

        <div className="rule my-9" />

        <div className="flex flex-col gap-12 lg:flex-row">
          <section className={'flex flex-1 flex-col gap-6 sm:flex-row sm:items-center ' + L(2)} aria-label="Ciclo de observación y ajuste">
            <SacCycle phase={phase} onPick={setSacPick} />
            <div className="min-w-0 flex-1"><SacPanel phase={phase} /></div>
          </section>
          <section className={'flex-1 lg:max-w-[440px] ' + L(4)}><Comprehension /></section>
        </div>

        <footer className="mt-9 flex flex-wrap items-center justify-between gap-3 border-t border-ink/10 pt-4 text-[11px] text-ink/45">
          <span>evidencia individual, offline · sin comparación entre niños</span>
          <span>κ y los niveles todavía no están validados con niños · uso orientativo</span>
        </footer>
      </div>
    </div>
  );
}

/* ============ Escaparate ============ */

const SCREENS = [
  { n: '01', name: 'Autoinforme', C: CheckInScreen },
  { n: '02', name: 'Lectura', C: ReadingScreen },
  { n: '03', name: 'Escucha', C: ListeningScreen },
  { n: '04', name: 'Andamio', C: ScaffoldScreen },
  { n: '05', name: 'Logro sobrio', C: AchievedScreen },
  { n: '06', name: 'Mapa del docente', C: TeacherScreen },
  { n: '07', name: 'Texto con prosodia', C: TextReadingScreen },
  { n: '08', name: 'Huella de lectura', C: TraceScreen },
];

function Segmented({ value, options, onChange, label }) {
  return (
    <div role="radiogroup" aria-label={label} className="flex rounded-full bg-paper p-1 ring-1 ring-ink/10">
      {options.map(([v, l]) => (
        <button key={v} type="button" role="radio" aria-checked={value === v} onClick={() => onChange(v)}
          className={'rounded-full px-3.5 py-1.5 text-[12px] transition-all duration-500 ' + (value === v ? 'bg-ink text-paper' : 'text-ink/60 hover:text-ink')}>{l}</button>
      ))}
    </div>
  );
}

function App() {
  const [theme, setTheme] = useState(() => matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const [mode, setMode] = useState('tour');
  const [idx, setIdx] = useState(1);
  useEffect(() => { document.documentElement.classList.toggle('dark', theme === 'dark'); }, [theme]);
  const go = (d) => setIdx((i) => (i + d + SCREENS.length) % SCREENS.length);
  const Current = SCREENS[idx].C;

  return (
    <main className="min-h-screen px-4 pb-16 pt-8">
      <header className="mx-auto mb-10 flex max-w-6xl flex-wrap items-end justify-between gap-5">
        <div>
          <Mark label="Reader" />
          <h2 className="serif mt-3 text-[34px] leading-none tracking-[-.03em] text-ink" style={{ fontWeight: 380 }}>
            Ve por el <em className="text-clay">eco</em>.
          </h2>
        </div>
        <div className="flex flex-wrap gap-2">
          <Segmented label="Vista" value={mode} onChange={setMode} options={[['tour', 'Recorrido'], ['grid', 'Galería']]} />
          <Segmented label="Tema" value={theme} onChange={setTheme} options={[['light', 'Claro'], ['dark', 'Oscuro']]} />
        </div>
      </header>

      {mode === 'tour' ? (
        <section className="flex flex-col items-center" aria-live="polite">
          <nav aria-label="Pantallas" className="mb-6 flex flex-wrap justify-center gap-x-5 gap-y-2">
            {SCREENS.map((s, i) => (
              <button key={s.n} type="button" onClick={() => setIdx(i)} aria-current={i === idx}
                className={'flex items-baseline gap-1.5 text-[12px] transition-colors duration-500 ' + (i === idx ? 'text-ink' : 'text-ink/40 hover:text-ink/70')}>
                <span className="serif italic">{s.n}</span>{s.name}
              </button>
            ))}
          </nav>
          <div key={idx + theme} className="screen-in"><Current onNext={() => go(1)} /></div>
          <div className="mt-6 flex items-center gap-4">
            <button type="button" onClick={() => go(-1)} className="press rounded-full px-4 py-2 text-[13px] text-ink/60 ring-1 ring-ink/15 hover:text-ink">← Anterior</button>
            <span className="serif text-[13px] italic tabular-nums text-ink/50">{SCREENS[idx].n} / {String(SCREENS.length).padStart(2, '0')}</span>
            <button type="button" onClick={() => go(1)} className="press rounded-full px-4 py-2 text-[13px] text-ink/60 ring-1 ring-ink/15 hover:text-ink">Siguiente →</button>
          </div>
        </section>
      ) : (
        <section className="mx-auto flex max-w-[1960px] flex-wrap justify-center gap-x-10 gap-y-14">
          {SCREENS.map(({ n, name, C }) => (
            <figure key={n + theme} className="screen-in">
              <C />
              <figcaption className="mt-4 flex items-baseline gap-2 px-2 text-[12px] text-ink/55">
                <span className="serif italic text-ink/80">{n}</span>{name}
              </figcaption>
            </figure>
          ))}
        </section>
      )}
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
